services:
  - type: web
    name: doyin-backend
    env: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: errorlog
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432" # Standard Supabase port
      - key: DB_DATABASE
        value: "postgres" # Default Supabase database name
