services:
  - type: web
    name: doyin-backend
    env: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false  # Generate via: php artisan key:generate --show
      - key: LOG_CHANNEL
        value: errorlog
      - key: DB_CONNECTION
        value: pgsql
      # Supabase Pooled Connection (use this for Render - direct connection is unreachable)
      # Host: <region>.pooler.supabase.com, Port: 6543, User: postgres.<project-ref>
      - key: DB_HOST
        sync: false  # e.g. aws-1-eu-west-2.pooler.supabase.com
      - key: DB_PORT
        value: "6543"
      - key: DB_DATABASE
        value: "postgres"
      - key: DB_USERNAME
        sync: false  # postgres.<your-project-ref> (e.g. postgres.aadmgspanwzcmzyxupsw)
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: "require"
      # Leave DATABASE_URL empty when using individual DB_* vars
      - key: DATABASE_URL
        value: ""
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Doyin Kenya"
      - key: SESSION_DRIVER
        value: database
