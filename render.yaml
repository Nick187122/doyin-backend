services:
  - type: web
    name: doyin-backend
    env: docker
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false  # Generate via: php artisan key:generate --show
      - key: LOG_CHANNEL
        value: errorlog
      - key: DB_CONNECTION
        value: pgsql
      # Supabase Direct Connection (recommended - avoids pooler issues)
      # Host: db.<project-ref>.supabase.co, Port: 5432, User: postgres
      - key: DB_HOST
        sync: false  # Your Supabase direct host, e.g. db.xxxxx.supabase.co
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: "postgres"
      - key: DB_USERNAME
        value: "postgres"
      - key: DB_PASSWORD
        sync: false  # Your Supabase database password
      - key: DB_SSLMODE
        value: "require"
      # Leave DATABASE_URL empty when using individual DB_* vars
      - key: DATABASE_URL
        value: ""
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: "Doyin Kenya"
      - key: SESSION_DRIVER
        value: database
